name: Autonomous Lead System Loop

on:
  schedule:
    - cron: "*/5 * * * *"
    - cron: "*/10 * * * *"
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      APP_URL: ${{ secrets.APP_URL }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
      EVENT_NAME: ${{ github.event_name }}
      EVENT_SCHEDULE: ${{ github.event.schedule }}
    steps:
      - name: Validate scheduler secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "$APP_URL" || { echo "Missing GitHub Actions secret: APP_URL"; exit 1; }
          test -n "$CRON_SECRET" || { echo "Missing GitHub Actions secret: CRON_SECRET"; exit 1; }

      - name: Run scheduled pipeline
        shell: bash
        run: |
          set -euo pipefail

          call_cron() {
            local path="$1"
            echo "Calling ${path}"
            curl \
              --request GET \
              --fail-with-body \
              --silent \
              --show-error \
              --retry 2 \
              --retry-delay 5 \
              --retry-all-errors \
              --connect-timeout 15 \
              --max-time 120 \
              --header "Authorization: Bearer ${CRON_SECRET}" \
              "${APP_URL%/}${path}"
            echo
          }

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            call_cron "/api/cron/auto-scrape"
            call_cron "/api/cron/process-leads"
            call_cron "/api/cron/auto-push"
            call_cron "/api/cron/process-outreach"
            call_cron "/api/cron/sync-replies"
            call_cron "/api/cron/youtube-discover"
            call_cron "/api/cron/youtube-outreach"
            call_cron "/api/cron/revqr-whatsapp"
          elif [[ "$EVENT_SCHEDULE" == "0 0 * * *" ]]; then
            call_cron "/api/cron/auto-scrape"
            call_cron "/api/cron/youtube-discover"
          elif [[ "$EVENT_SCHEDULE" == "*/10 * * * *" ]]; then
            call_cron "/api/cron/process-leads"
            call_cron "/api/cron/auto-push"
          elif [[ "$EVENT_SCHEDULE" == "*/5 * * * *" ]]; then
            call_cron "/api/cron/process-outreach"
            call_cron "/api/cron/sync-replies"
            call_cron "/api/cron/youtube-outreach"
            call_cron "/api/cron/revqr-whatsapp"
          else
            echo "Unsupported scheduler event: ${EVENT_NAME} / ${EVENT_SCHEDULE}"
            exit 1
          fi
