name: Lead Recovery – Interval Loop

on:
  schedule:
    # Every 5 minutes: send queued outreach and sync Gmail replies.
    - cron: "*/5 * * * *"
    # Every 10 minutes: score new leads and push high-scorers to Instantly.
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      APP_URL: ${{ secrets.APP_URL }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
      EVENT_NAME: ${{ github.event_name }}
      EVENT_SCHEDULE: ${{ github.event.schedule }}
    steps:
      - name: Validate scheduler secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "$APP_URL"     || { echo "Missing GitHub Actions secret: APP_URL"; exit 1; }
          test -n "$CRON_SECRET" || { echo "Missing GitHub Actions secret: CRON_SECRET"; exit 1; }

      - name: Run interval pipeline
        shell: bash
        run: |
          set -euo pipefail
          failures=()

          call_cron() {
            local path="$1"
            echo "Calling ${path}"
            if curl \
              --request GET \
              --fail-with-body \
              --silent \
              --show-error \
              --retry 2 \
              --retry-delay 5 \
              --retry-all-errors \
              --connect-timeout 15 \
              --max-time 120 \
              --header "Authorization: Bearer ${CRON_SECRET}" \
              "${APP_URL%/}${path}"; then
              echo
            else
              failures+=("${path}")
              echo "Cron endpoint failed: ${path}" >&2
            fi
          }

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            # Manual trigger: run everything so the operator can verify the full pipeline.
            call_cron "/api/cron/process-leads"
            call_cron "/api/cron/auto-push"
            call_cron "/api/cron/process-outreach"
            call_cron "/api/cron/sync-replies"
          elif [[ "$EVENT_SCHEDULE" == "*/10 * * * *" ]]; then
            call_cron "/api/cron/process-leads"
            call_cron "/api/cron/auto-push"
          elif [[ "$EVENT_SCHEDULE" == "*/5 * * * *" ]]; then
            call_cron "/api/cron/process-outreach"
            call_cron "/api/cron/sync-replies"
          else
            echo "Unsupported scheduler event: ${EVENT_NAME} / ${EVENT_SCHEDULE}"
            exit 1
          fi

          if (( ${#failures[@]} )); then
            printf 'Failed cron endpoints: %s\n' "${failures[*]}" >&2
            exit 1
          fi
